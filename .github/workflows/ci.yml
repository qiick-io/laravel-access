name: CI

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    # edited: the PR title check reruns when the title changes.
    types: [opened, edited, synchronize, reopened]
  # Nightly: the full matrix, mutation on every class and composer audit (F24).
  schedule:
    - cron: '23 2 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # The shared app-ui matrix (checklist item 17e): PHP x Laravel x
  # lowest/stable and the server databases. On a pull request it plans only
  # what the change can break; push, nightly and manual runs get everything.
  # Every job keeps its name and reports: steps skip, jobs never do.
  package-matrix:
    uses: qiick-io/app-ui/.github/workflows/package-matrix.yml@0d97ae1429a856411c76e6de1ec258cae0eabab6 # v0.15.0
    with:
      app-ui-ref: 0d97ae1429a856411c76e6de1ec258cae0eabab6

  tests:
    name: PHP ${{ matrix.php }} Laravel ${{ matrix.laravel }} ${{ matrix.dependency-version }}
    needs: package-matrix
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.package-matrix.outputs.matrix) }}
    steps:
      - name: Checkout
        if: ${{ !matrix.skip }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        if: ${{ !matrix.skip }}
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: composer:v2
          extensions: pdo_sqlite

      - name: Validate composer.json
        if: ${{ !matrix.skip }}
        run: composer validate --strict --no-check-lock

      - name: Install dependencies
        if: ${{ !matrix.skip }}
        env:
          LARAVEL_MAJOR: ${{ matrix.laravel }}
          TESTBENCH_MAJOR: ${{ matrix.testbench }}
          DEPENDENCY_VERSION: ${{ matrix.dependency-version }}
        run: |
          composer require --dev --no-interaction --no-update "orchestra/testbench:^${TESTBENCH_MAJOR}.0"
          composer require --no-interaction --no-update \
            "illuminate/auth:^${LARAVEL_MAJOR}.0" \
            "illuminate/contracts:^${LARAVEL_MAJOR}.0" \
            "illuminate/database:^${LARAVEL_MAJOR}.0" \
            "illuminate/http:^${LARAVEL_MAJOR}.0" \
            "illuminate/support:^${LARAVEL_MAJOR}.0"
          if [ "${DEPENDENCY_VERSION}" = "lowest" ]; then
            composer update --no-interaction --prefer-dist --prefer-lowest --with-all-dependencies
          else
            composer update --no-interaction --prefer-dist --with-all-dependencies
          fi

      - name: Composer audit
        if: ${{ !matrix.skip }}
        run: composer audit --no-interaction

      - name: Pest on SQLite
        if: ${{ !matrix.skip }}
        run: vendor/bin/pest

      - run: node tests/Erasure/run.mjs
        if: ${{ !matrix.skip }}

  # Static analysis depends on the tool versions, not on the runtime floor
  # (with --prefer-lowest, old polyfills redefine core functions without
  # types), so it runs once, on the highest PHP.
  lint:
    name: Pint and PHPStan
    needs: package-matrix
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        if: needs.package-matrix.outputs.docs-only != 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        if: needs.package-matrix.outputs.docs-only != 'true'
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.5'
          coverage: none
          tools: composer:v2

      - name: Install dependencies
        if: needs.package-matrix.outputs.docs-only != 'true'
        run: composer update --no-interaction --prefer-dist --with-all-dependencies

      - name: Pint
        if: needs.package-matrix.outputs.docs-only != 'true'
        run: vendor/bin/pint --test

      - name: PHPStan
        if: needs.package-matrix.outputs.docs-only != 'true'
        run: vendor/bin/phpstan analyse --memory-limit=1G --no-progress

      # Level max with no baseline: the ratchet fails if a baseline ever appears.
      - name: Larastan baseline only shrinks
        if: needs.package-matrix.outputs.docs-only != 'true'
        run: node scripts/qiick-ratchet.mjs phpstan --min-level max

  # Group SQL, the package migrations and the principal races need real
  # engines (design §11 / §13.2): the shared list, PostgreSQL 17, MySQL 8.4
  # and MariaDB 11.4 (LTS). They run on every pull request that is not
  # docs-only: the shared database paths miss this package's SQL classes
  # (EloquentGroupRoleSource, EloquentPrincipalDirectory, AccessEraser).
  databases:
    name: Databases (${{ matrix.database.name }})
    needs: package-matrix
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        database: ${{ fromJSON(needs.package-matrix.outputs.databases) }}
    env:
      DB_CONNECTION: ${{ matrix.database.connection }}
      DB_HOST: 127.0.0.1
      DB_PORT: ${{ matrix.database.port }}
      DB_DATABASE: qiick_package
      DB_USERNAME: ${{ matrix.database.username }}
      DB_PASSWORD: ${{ matrix.database.password }}
    services:
      database:
        image: ${{ (needs.package-matrix.outputs.run-databases == 'true' || needs.package-matrix.outputs.docs-only != 'true') && matrix.database.image || '' }}
        env: ${{ matrix.database.environment }}
        ports:
          - ${{ matrix.database.port }}:${{ matrix.database.port }}
        options: ${{ matrix.database.options }}
    steps:
      - name: Checkout
        if: needs.package-matrix.outputs.run-databases == 'true' || needs.package-matrix.outputs.docs-only != 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        if: needs.package-matrix.outputs.run-databases == 'true' || needs.package-matrix.outputs.docs-only != 'true'
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.5'
          coverage: none
          tools: composer:v2
          extensions: pdo_sqlite, pdo_mysql, pdo_pgsql, pcntl

      - name: Install dependencies
        if: needs.package-matrix.outputs.run-databases == 'true' || needs.package-matrix.outputs.docs-only != 'true'
        run: composer update --no-interaction --prefer-dist --with-all-dependencies

      - name: Pest (engine group)
        if: needs.package-matrix.outputs.run-databases == 'true' || needs.package-matrix.outputs.docs-only != 'true'
        run: vendor/bin/pest --group=engines

      - run: node tests/Erasure/run.mjs
        if: needs.package-matrix.outputs.run-databases == 'true' || needs.package-matrix.outputs.docs-only != 'true'

  # The fleet erasure suite once on every run, unconditionally (the drift
  # check requires one run.mjs step that nothing can skip); the matrix cells
  # and the server databases run it again where they run.
  erasure:
    name: Erasure (E1–E14)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.5'
          coverage: none
          tools: composer:v2
          extensions: pdo_sqlite

      - name: Install dependencies
        run: composer update --no-interaction --prefer-dist --with-all-dependencies

      # Every pull request audits the dependencies, a docs-only one too (F24).
      - name: Composer audit
        run: composer audit --no-interaction

      - run: node tests/Erasure/run.mjs

  # Per-class mutation at >= 95% (checklist item 3): every file in src/ on
  # push and nightly, the classes a pull request changes otherwise.
  mutation-shards:
    name: Mutation (shard ${{ matrix.shard }}/4)
    needs: package-matrix
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    env:
      # Not only mutate-classes: the shared plan leaves src/Testing/ out, and
      # the script adds the changed test helpers itself.
      HAS_MUTATION_WORK: ${{ needs.package-matrix.outputs.docs-only != 'true' }}
    steps:
      - name: Checkout
        if: env.HAS_MUTATION_WORK == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup PHP
        if: env.HAS_MUTATION_WORK == 'true'
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.5'
          # pest --mutate needs a coverage driver.
          coverage: pcov
          tools: composer:v2
          extensions: pdo_sqlite

      - name: Install dependencies
        if: env.HAS_MUTATION_WORK == 'true'
        run: composer update --no-interaction --prefer-dist --with-all-dependencies

      - name: Pest mutate per class (min 95)
        if: env.HAS_MUTATION_WORK == 'true'
        env:
          MUTATE_SCOPE: ${{ needs.package-matrix.outputs.mutate-scope }}
          MUTATE_CLASSES: ${{ needs.package-matrix.outputs.mutate-classes }}
          MUTATE_SHARD: ${{ matrix.shard }}
          MUTATE_SHARDS: 4
          MUTATE_DIFF_BASE: ${{ github.event.pull_request.base.sha }}
        run: bash scripts/mutate-per-class.sh

  mutation:
    name: Mutation (per-class ≥95%)
    needs: mutation-shards
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every shard passed
        env:
          SHARDS_RESULT: ${{ needs.mutation-shards.result }}
        run: test "${SHARDS_RESULT}" = success

  standards:
    uses: qiick-io/app-ui/.github/workflows/drift-check.yml@0d97ae1429a856411c76e6de1ec258cae0eabab6 # v0.15.0
    with:
      standards: true
      registry: false

  pr-title:
    if: github.event_name == 'pull_request'
    uses: qiick-io/app-ui/.github/workflows/pr-title.yml@0d97ae1429a856411c76e6de1ec258cae0eabab6 # v0.15.0

  nightly-failure:
    needs: [package-matrix, tests, lint, databases, erasure, mutation, standards]
    if: failure() && github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - name: Open an issue for the failing run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create --repo "${GITHUB_REPOSITORY}" \
            --title "Nightly CI failed on $(date -u +%F)" \
            --label bug \
            --body "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
