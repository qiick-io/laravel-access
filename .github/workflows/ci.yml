name: CI

on:
  push:
    branches:
      - main
      - develop
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Exception to checklist item 17e, recorded 2026-11-24: app-ui (v0.13.0)
  # has no reusable package matrix workflow (PHP x Laravel x lowest/stable,
  # database engines); its reusable workflows are single gates or app
  # pipelines. The maintainer is adding one to app-ui for every package;
  # this local matrix moves to it then.
  tests:
    name: PHP ${{ matrix.php }} Laravel ${{ matrix.laravel }} ${{ matrix.dependency-version }}
    runs-on: ubuntu-latest
    # The one cell that also runs per-class mutation needs more than the
    # others; a job timeout below the step's own cancels it mid-run.
    timeout-minutes: ${{ matrix.php == '8.4' && matrix.laravel == '12' && matrix.dependency-version == 'stable' && 50 || 20 }}
    strategy:
      fail-fast: false
      matrix:
        php:
          - '8.3'
          - '8.4'
          - '8.5'
        laravel:
          - '12'
          - '13'
        dependency-version:
          - lowest
          - stable
        include:
          - laravel: '12'
            testbench: '10'
          - laravel: '13'
            testbench: '11'
    steps:
      - name: Checkout
        # actions/checkout@v4.2.2
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup PHP
        # shivammathur/setup-php@2.40.0
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: ${{ matrix.php }}
          # pcov required for the mutate cell (pest --mutate needs a coverage driver).
          coverage: ${{ (matrix.php == '8.4' && matrix.laravel == '12' && matrix.dependency-version == 'stable') && 'pcov' || 'none' }}
          tools: composer:v2
          extensions: pdo_sqlite, pdo_mysql, pdo_pgsql

      - name: Validate composer.json
        run: composer validate --strict --no-check-lock

      - name: Install dependencies
        run: |
          composer require --dev --no-interaction --no-update "orchestra/testbench:^${{ matrix.testbench }}.0"
          composer require --no-interaction --no-update \
            "illuminate/auth:^${{ matrix.laravel }}.0" \
            "illuminate/contracts:^${{ matrix.laravel }}.0" \
            "illuminate/database:^${{ matrix.laravel }}.0" \
            "illuminate/http:^${{ matrix.laravel }}.0" \
            "illuminate/support:^${{ matrix.laravel }}.0"
          if [ "${{ matrix.dependency-version }}" = "lowest" ]; then
            composer update --no-interaction --prefer-dist --prefer-lowest --with-all-dependencies
          else
            composer update --no-interaction --prefer-dist --with-all-dependencies
          fi

      - name: Composer audit
        run: composer audit --no-interaction

      # Static analysis depends on the tool versions, not on the runtime floor:
      # with --prefer-lowest, old polyfills redefine core functions without types.
      - name: Pint
        if: matrix.dependency-version == 'stable'
        run: vendor/bin/pint --test

      - name: PHPStan
        if: matrix.dependency-version == 'stable'
        run: vendor/bin/phpstan analyse --memory-limit=1G --no-progress

      # Level max with no baseline: the ratchet fails if a baseline ever appears.
      - name: Larastan baseline only shrinks
        run: node scripts/qiick-ratchet.mjs phpstan --min-level max

      - name: Pest
        run: vendor/bin/pest

      # Mutation targets from the design §11. Per-class min 95; surface the table
      # in the job summary. Bound the step so a hung mutate cannot burn the cell.
      - name: Pest mutate (security-critical classes, per-class min 95)
        if: matrix.php == '8.4' && matrix.laravel == '12' && matrix.dependency-version == 'stable'
        timeout-minutes: 40
        run: |
          set -euo pipefail
          output="$(mktemp)"
          bash scripts/mutate-per-class.sh | tee "${output}"
          if [ -n "${GITHUB_STEP_SUMMARY:-}" ]; then
            awk '/^## Per-class mutation scores$/{flag=1} flag{print}' "${output}" >> "${GITHUB_STEP_SUMMARY}"
          fi

  # Group SQL (EloquentGroupRoleSource) and package migrations need real engines
  # (design §11 / §13.2: PostgreSQL 17, MySQL 8.4, MariaDB 10.11).
  databases:
    name: Databases (${{ matrix.database.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        database:
          - name: MySQL 8.4
            connection: mysql
            image: mysql:8.4
            port: 3306
            options: >-
              -e MYSQL_ALLOW_EMPTY_PASSWORD=yes -e MYSQL_DATABASE=laravel_access
              --health-cmd="mysqladmin ping -h 127.0.0.1" --health-interval=5s --health-retries=20
          - name: MariaDB 10.11
            connection: mariadb
            image: mariadb:10.11
            port: 3306
            options: >-
              -e MARIADB_ALLOW_EMPTY_ROOT_PASSWORD=yes -e MARIADB_DATABASE=laravel_access
              --health-cmd="healthcheck.sh --connect --innodb_initialized" --health-interval=5s --health-retries=20
          - name: PostgreSQL 17
            connection: pgsql
            image: postgres:17
            port: 5432
            options: >-
              -e POSTGRES_HOST_AUTH_METHOD=trust -e POSTGRES_DB=laravel_access
              --health-cmd="pg_isready -U postgres" --health-interval=5s --health-retries=20
    services:
      database:
        image: ${{ matrix.database.image }}
        ports:
          - ${{ matrix.database.port }}:${{ matrix.database.port }}
        options: ${{ matrix.database.options }}
    steps:
      - name: Checkout
        # actions/checkout@v4.2.2
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup PHP
        # shivammathur/setup-php@2.40.0
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.4'
          coverage: none
          tools: composer:v2
          extensions: pdo_sqlite, pdo_mysql, pdo_pgsql

      - name: Install dependencies
        run: |
          composer require --dev --no-interaction --no-update "orchestra/testbench:^10.0"
          composer require --no-interaction --no-update \
            "illuminate/auth:^12.0" \
            "illuminate/contracts:^12.0" \
            "illuminate/database:^12.0" \
            "illuminate/http:^12.0" \
            "illuminate/support:^12.0"
          composer update --no-interaction --prefer-dist --with-all-dependencies

      - name: Pest (group engines)
        env:
          DB_CONNECTION: ${{ matrix.database.connection }}
          DB_HOST: 127.0.0.1
          DB_PORT: ${{ matrix.database.port }}
          DB_DATABASE: laravel_access
          DB_USERNAME: ${{ matrix.database.connection == 'pgsql' && 'postgres' || 'root' }}
          DB_PASSWORD: ''
        run: vendor/bin/pest --group=engines

  standards:
    # qiick-io/app-ui@v0.12.0
    uses: qiick-io/app-ui/.github/workflows/drift-check.yml@f613af9febfce3b6d7f7f41785e9845a610080c7 # v0.12.0
    with:
      standards: true
      registry: false

  pr-title:
    if: github.event_name == 'pull_request'
    # qiick-io/app-ui@v0.12.0
    uses: qiick-io/app-ui/.github/workflows/pr-title.yml@f613af9febfce3b6d7f7f41785e9845a610080c7 # v0.12.0
